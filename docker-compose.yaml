services:
  db:
    image: postgres:18-alpine
    container_name: todoer-db
    environment:
      POSTGRES_USER: todoer
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todoer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todoer"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: