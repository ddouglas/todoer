{{define "page.todo-detail"}}
<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todoer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
      body {
        padding: 0;
        margin: 0;
      }

      .app-container {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      .content-wrapper {
        display: flex;
        flex: 1;
      }

      main.container {
        flex: 1;
        padding: 2rem;
        max-width: 100%;
      }
    </style>
  </head>

  <body>
    <div class="app-container">
      {{template "component.nav" .}}
      <div class="content-wrapper">
        {{template "component.sidebar" .}}
        <main class="container">
          <section>
            <div style="margin-bottom: 2rem;">
              <a href="/" style="text-decoration: none;">← Back to Todos</a>
            </div>
            <h1>{{if .IsNew}}Create New Todo
              {{else}}Edit Todo{{end}}
            </h1>
            {{template "component.todo.detail-form" .}}
          </section>
        </main>
      </div>
    </div>
    <div id="modal-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
  </body>

</html>
{{end}}
