{{define "page.todo-detail"}}
<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todoer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
      body {
        background-color: #f8f9fa;
      }

      .sidebar {
        height: calc(100vh - 56px);
        position: sticky;
        top: 56px;
        background-color: white;
        border-right: 1px solid #dee2e6;
        overflow-y: auto;
      }

      .main-content {
        min-height: calc(100vh - 56px);
        background-color: white;
      }
    </style>
  </head>

  <body>
    {{template "component.nav" .}}
    <div class="container-fluid">
      <div class="row">
        {{template "component.sidebar" .}}
        <main class="col-md-9 col-lg-10 px-md-4 main-content">
          <div class="py-4">
            <div class="mb-4">
              <a href="/" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Back to Todos
              </a>
            </div>
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <h2 class="card-title mb-4">
                  {{if .IsNew}}<i class="bi bi-plus-circle"></i> Create New Todo
                  {{else}}<i class="bi bi-pencil"></i> Edit Todo{{end}}
                </h2>
                {{template "component.todo.detail-form" .}}
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <div id="modal-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
  </body>

</html>
{{end}}
