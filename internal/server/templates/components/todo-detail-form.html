{{define "component.todo.detail-form"}}
<form {{if .IsNew}} hx-post="/todos" hx-target="#todos-list" hx-swap="afterbegin"
  hx-on::after-request="if(event.detail.successful) { const modal = bootstrap.Modal.getInstance(document.getElementById('todo-modal')); if(modal) modal.hide(); }" {{else}} hx-put="/todos/{{.Todo.ID}}"
  hx-target="#todo-{{.Todo.ID}}" hx-swap="outerHTML"
  hx-on::after-request="if(event.detail.successful) { const modal = bootstrap.Modal.getInstance(document.getElementById('todo-modal')); if(modal) modal.hide(); }" {{end}}>

  <!-- Title -->
  <div class="mb-3">
    <label for="title" class="form-label">Title</label>
    <input type="text" class="form-control" id="title" name="title" value="{{if .Todo}}{{.Todo.Title}}{{end}}" placeholder="What needs to be done?" required autofocus />
  </div>

  <!-- Description -->
  <div class="mb-3">
    <label for="description" class="form-label">Description</label>
    <textarea class="form-control" id="description" name="description" rows="4" placeholder="Add more details...">{{if .Todo}}{{if .Todo.Description}}{{.Todo.Description}}{{end}}{{end}}</textarea>
  </div>

  <!-- Category -->
  <div class="mb-3">
    <label for="category_id" class="form-label">Category</label>
    <select class="form-select" id="category_id" name="category_id">
      <option value="">No Category</option>
      {{range .Categories}}
      <option value="{{.ID}}" {{if $.Todo}}{{if $.Todo.Category}}{{if eq $.Todo.Category.ID .ID}}selected{{end}}{{end}}{{end}}>
        {{if .Icon}}{{.Icon}} {{end}}{{.Name}}
      </option>
      {{end}}
    </select>
  </div>

  <!-- Priority & Due Date Row -->
  <div class="row">
    <!-- Priority -->
    <div class="col-md-6 mb-3">
      <label for="priority" class="form-label">Priority</label>
      <select class="form-select" id="priority" name="priority">
        <option value="low" {{if .Todo}}{{if eq .Todo.Priority "low"}}selected{{end}}{{end}}>Low</option>
        <option value="medium" {{if .Todo}}{{if eq .Todo.Priority "medium"}}selected{{end}}{{end}}>Medium</option>
        <option value="high" {{if .Todo}}{{if eq .Todo.Priority "high"}}selected{{end}}{{end}}>High</option>
      </select>
    </div>

    <!-- Status -->
    <div class="col-md-6 mb-3">
      <label for="status" class="form-label">Status</label>
      <select class="form-select" id="status" name="status">
        <option value="not_started" {{if .Todo}}{{if eq .Todo.Status "not_started"}}selected{{end}}{{end}}>Not Started</option>
        <option value="in_progress" {{if .Todo}}{{if eq .Todo.Status "in_progress"}}selected{{end}}{{end}}>In Progress</option>
        <option value="completed" {{if .Todo}}{{if eq .Todo.Status "completed"}}selected{{end}}{{end}}>Completed</option>
      </select>
    </div>
  </div>

  <!-- Due Date Row -->
  <div class="row">
    <!-- Due Date -->
    <div class="col-md-6 mb-3">
      <label for="due_date" class="form-label">Due Date</label>
      <input type="date" class="form-control" id="due_date" name="due_date" value="{{if .Todo}}{{if .Todo.DueDate}}{{.Todo.DueDate.Format "2006-01-02"}}{{end}}{{end}}" />
    </div>
  </div>

  <!-- Reminder -->
  <div class="mb-3">
    <label for="reminder_at" class="form-label">Reminder</label>
    <input type="datetime-local" class="form-control" id="reminder_at" name="reminder_at" value="{{if .Todo}}{{if .Todo.ReminderAt}}{{.Todo.ReminderAt.Format "2006-01-02T15:04"}}{{end}}{{end}}" />
  </div>

  <!-- Nag Settings (Collapsible) -->
  <div class="mb-3">
    <div class="d-flex align-items-center justify-content-between">
      <label class="form-label mb-0">
        <i class="bi bi-bell-fill"></i> Nag Settings
      </label>
      <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#nagSettings" aria-expanded="false" aria-controls="nagSettings">
        <i class="bi bi-chevron-down"></i>
      </button>
    </div>
    <div class="collapse mt-2" id="nagSettings">
      <div class="card card-body">
        <!-- Enable Nagging -->
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="nag_enabled" name="nag_enabled" value="true" {{if .Todo}}{{if .Todo.NagSettings}}{{if .Todo.NagSettings.Enabled}}checked{{end}}{{end}}{{end}} />
          <label class="form-check-label" for="nag_enabled">
            Enable nagging reminders
          </label>
          <div class="form-text">Sends persistent notifications until todo is completed or in progress</div>
        </div>

        <!-- Nag Interval -->
        <div class="mb-3">
          <label for="nag_interval" class="form-label">Nag every (minutes)</label>
          <input type="number" class="form-control" id="nag_interval" name="nag_interval" min="1" max="1440" value="{{if .Todo}}{{if .Todo.NagSettings}}{{.Todo.NagSettings.IntervalMinutes}}{{else}}10{{end}}{{else}}10{{end}}" />
          <div class="form-text">How often to send reminder notifications</div>
        </div>

        <!-- Nag Duration -->
        <div class="mb-3">
          <label for="nag_duration" class="form-label">Nag for (minutes)</label>
          <input type="number" class="form-control" id="nag_duration" name="nag_duration" min="1" max="10080" value="{{if .Todo}}{{if .Todo.NagSettings}}{{.Todo.NagSettings.DurationMinutes}}{{else}}60{{end}}{{else}}60{{end}}" />
          <div class="form-text">Total duration to keep nagging (starting from due date)</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Completed (only show for edit) -->
  {{if not .IsNew}}
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="completed" name="completed" {{if .Todo.Completed}}checked{{end}} />
    <label class="form-check-label" for="completed">
      Mark as completed
    </label>
  </div>
  {{end}}

  <!-- Actions -->
  <div class="d-flex gap-2 justify-content-end">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
      Cancel
    </button>
    <button type="submit" class="btn btn-primary">
      {{if .IsNew}}<i class="bi bi-plus-lg"></i> Create Todo
      {{else}}<i class="bi bi-save"></i> Save Changes{{end}}
    </button>
  </div>
</form>
{{end}}
