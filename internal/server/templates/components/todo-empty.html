    <i class="bi bi-inbox" style="font-size: 4rem;"></i>
    <p class="mt-3 fs-5">No todos yet. Create one to get started!</p>
  </div>
</div>
{{end}}

{{define "component.todo.empty-oob"}}

      <p class="mt-3 fs-5">No todos yet. Create one to get started!</p>
    </div>
  </div>
</div>
{{end}}

{{define "component.todo.empty-delete"}}

{{end}}
