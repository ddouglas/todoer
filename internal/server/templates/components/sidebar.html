{{define "component.sidebar"}}
<nav class="col-md-3 col-lg-2 d-md-block sidebar">
  <div class="position-sticky pt-3">
    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted text-uppercase">
      <span>Quick Filters</span>
    </h6>
    <ul class="list-group list-group-flush">
      <a href="/?filter=all" class="list-group-item list-group-item-action {{if eq .SelectedFilter "all"}}active{{end}}">
        <i class="bi bi-list-check"></i> All Todos
      </a>
      <a href="/?filter=today" class="list-group-item list-group-item-action {{if eq .SelectedFilter "today"}}active{{end}}">
        <i class="bi bi-calendar-check"></i> Today
      </a>
      <a href="/?filter=week" class="list-group-item list-group-item-action {{if eq .SelectedFilter "week"}}active{{end}}">
        <i class="bi bi-calendar-week"></i> This Week
      </a>
    </ul>

    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted text-uppercase">
      <span>Categories</span>
    </h6>
    <ul class="list-group list-group-flush">
      {{if .Categories}}
      {{range .Categories}}
      <a href="/?filter=category&category={{.ID}}" class="list-group-item list-group-item-action d-flex align-items-center {{if eq $.SelectedFilter .ID}}active{{end}}">
        <span class="badge rounded-circle me-2" style="background-color: {{.Color}}; width: 12px; height: 12px; padding: 0;"></span>
        {{if .Icon}}<span class="me-1">{{.Icon}}</span>{{end}} {{.Name}}
      </a>
      {{end}}
      {{end}}
      <a href="/categories/new" hx-get="/categories/new" hx-target="#modal-container" hx-swap="innerHTML" class="list-group-item list-group-item-action text-primary">
        <i class="bi bi-plus-circle"></i> New Category
      </a>
    </ul>
  </div>
</nav>
{{end}}
